name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build .plugin file
      run: |
        cat metadata.json > auygram_enhancer.plugin
        echo "" >> auygram_enhancer.plugin
        echo "---PYTHON---" >> auygram_enhancer.plugin
        cat loader.py >> auygram_enhancer.plugin

    - name: Upload .plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: auygram-plugin
        path: auygram_enhancer.plugin
